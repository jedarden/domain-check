# CI workflow disabled - this project uses Argo Workflows for CI/CD.
# See .github/workflows/release.yml for release automation (GitHub releases + Docker).
# CI runs on iad-ci cluster via Argo Workflows.
# WorkflowTemplate: domain-check-build in declarative-config.

name: CI (Disabled)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  disabled:
    name: CI Disabled - Use Argo Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: |
          echo "::notice::GitHub Actions CI is disabled for this repository."
          echo "::notice::CI/CD runs on Argo Workflows in the iad-ci cluster."
          echo "::notice::See the WorkflowTemplate 'domain-check-build' in declarative-config."
          exit 0
